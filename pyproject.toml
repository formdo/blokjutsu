[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blokjutsu"
version = "1.0.0rc4"
description = "A local, permissively licensed, open-source Mac app for generating and editing images from text prompts with the open-weight MOSS-Image model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bob Carpenter" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "PySide6-Essentials>=6.6",      # the core Qt modules; full PySide6 adds several hundred MB the app does not use
  "torch>=2.9", "torchvision", "diffusers>=0.38", "transformers>=5.3", "accelerate>=1.10",
  "huggingface_hub>=1.0", "httpx", "safetensors>=0.6", "Pillow>=10", "numpy",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://formdo.github.io/blokjutsu/"
Source = "https://github.com/formdo/blokjutsu"
Issues = "https://github.com/formdo/blokjutsu/issues"

[project.scripts]
blokjutsu = "blokjutsu.app:main"

[tool.setuptools.packages.find]
include = ["blokjutsu*"]

[tool.setuptools.package-data]
blokjutsu = ["resources/*.png", "resources/*.svg"]
