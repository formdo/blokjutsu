title: Blokjutsu
description: A local, permissively licensed, open-source Mac app for generating and editing images from text prompts with the open-weight MOSS-Image model.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
logo: /assets/icon.png
favicon_ico: /assets/icon.png
color_scheme: blokjutsu
search_enabled: true
heading_anchors: true
# Large picture in link previews; set per page with `image:` in front matter.
twitter:
  card: summary_large_image
baseurl: /blokjutsu
# The current release, used by _includes/download.html and the install steps.
release:
  version: 1.0.0rc3
  size: 360 MB
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - serve.sh
# GitHub Pages gives every page the theme's layout; a local Jekyll needs it said.
defaults:
  - scope:
      path: ""
    values:
      layout: default
# Quiet the theme's Sass deprecation warnings in a local preview.
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]
